# 望舒 WANGSHU · 演示站点（IP + ziphare.me）
# 安装：sudo cp deploy/nginx-wangshu.conf /etc/nginx/sites-available/wangshu
#      sudo ln -sf /etc/nginx/sites-available/wangshu /etc/nginx/sites-enabled/wangshu
#      sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ /models 是 SPA 路由（车型矩阵 / 车型详情），不能写 location /models/，
#    否则 prefix location 会抢走 /models 与 /models/:slug，导致整页 nginx 404。
#    静态车模只匹配 .glb 文件。
server {
    listen 80;
    listen [::]:80;
    server_name 203.0.113.10 ziphare.me www.ziphare.me;

    root /var/www/wangshu;
    index index.html;
    charset utf-8;
    client_max_body_size 2m;

    # 经 Cloudflare 的 HTTP 访问强制跳 HTTPS（CF 会带 X-Forwarded-Proto: http）。
    # IP 直连（203.0.113.10）不带该头，保持 HTTP 可访问，作为演示兜底。
    # 已实测：HTTPS 请求 XFP=https，HTTP 请求 XFP=http，源站 $scheme 恒为 http（隧道回源）。
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 只匹配 .glb，把 /models、/models/:slug 留给 SPA fallback
    location ~ ^/models/[\w.-]+\.glb$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        types { application/octet-stream glb; }
    }

    # /models 与静态目录同名：必须显式返回 SPA 入口，
    # 否则 try_files 会把目录请求 301 到 /models/，再 301 回来形成循环。
    location = /models {
        try_files /index.html =404;
    }

    # 兼容误加尾斜杠的访问
    location = /models/ {
        return 301 /models;
    }

    location /images/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /basis/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
